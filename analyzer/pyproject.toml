[project]
name = "pkgguard-analyzer"
version = "0.1.0"
description = "PkgGuard package analyzer: fetch, checks, AI triage, scoring"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-ulid>=3.0",
]

[project.scripts]
analyze = "pkgguard_analyzer.cli:main"
pkgguard-export-schema = "pkgguard_analyzer.export_schema:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
