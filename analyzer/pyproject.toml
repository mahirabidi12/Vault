[project]
name = "pkgguard-analyzer"
version = "0.1.0"
description = "PkgGuard package analyzer: fetch, checks, AI triage, scoring"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.2.3",
    "python-ulid>=3.0",
    "strands-agents[openai]>=1.56.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "yara-python>=4.5.4",
]

[project.scripts]
analyze = "pkgguard_analyzer.cli:main"
pkgguard-seed = "pkgguard_analyzer.seed:main"
pkgguard-export-schema = "pkgguard_analyzer.export_schema:main"
pkgguard-dev-api = "pkgguard_analyzer.local_api:main"
pkgguard-eval = "pkgguard_analyzer.eval:main"
pkgguard-sandbox = "pkgguard_analyzer.sandbox.local_runner:main"
pkgguard-sandbox-eval = "pkgguard_analyzer.sandbox.check:main"
pkgguard-sandbox-samples = "pkgguard_analyzer.sandbox.samples:main"
pkgguard-sandbox-pilot = "pkgguard_analyzer.sandbox.pilot:main"
pkgguard-sandbox-remote = "pkgguard_analyzer.sandbox.remote:main"
pkgguard-sandbox-examples = "pkgguard_analyzer.sandbox.examples:main"

[dependency-groups]
dev = [
    "moto[dynamodb,s3,secretsmanager,stepfunctions]>=5.2.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
